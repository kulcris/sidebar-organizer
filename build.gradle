plugins {
    id 'java'
    id 'idea'
}

group = 'com.sidebartoggle'
version = '1.0.0'

repositories {
    maven { url = 'https://repo.runelite.net'; content { includeGroupByRegex('net\\.runelite.*') } }
    mavenCentral()
}

def runeLiteVersion = providers.gradleProperty('runeliteVersion').getOrElse('latest.release')
dependencies {
    compileOnly "net.runelite:client:$runeLiteVersion"
    testImplementation "net.runelite:client:$runeLiteVersion"
    testImplementation "net.runelite:jshell:$runeLiteVersion"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

tasks.register('run', JavaExec) {
    group = 'application'
    description = 'Launch RuneLite with Disable Sidebar Icons loaded'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.sidebartoggle.SidebarToggleLauncher'
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}

test { systemProperty 'java.awt.headless', 'true' }
